name: Terraform

"on":
  pull_request:
    paths:
      - ".github/workflows/terraform.yml"
      - "terraform/**"
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/terraform.yml"
      - "terraform/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Terraform version
        id: terraform_version
        run: printf 'version=%s\n' "$(tr -d '[:space:]' < terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform_version.outputs.version }}

      - name: Check formatting
        run: terraform -chdir=terraform fmt -check -diff -recursive

      # -backend=false: pull-request tokens carry a pull_request OIDC subject
      # that the workload identity provider rejects, so this job never touches
      # the state bucket. Validation only needs the providers.
      - name: Initialize without a backend
        run: terraform -chdir=terraform init -input=false -backend=false

      - name: Validate
        run: terraform -chdir=terraform validate -no-color

  apply:
    name: Plan and apply
    # Runs on pushes to main and on every manual dispatch. The workload
    # identity provider trusts exactly this repository's refs/heads/main ref
    # subject, so a push to main (or a dispatch on main) authenticates, while a
    # dispatch from any other branch is rejected at the auth step before it can
    # read state. That rejection is the isolation check the README describes.
    # Do NOT add `environment:` to this job: it would change the subject to
    # ...:environment:<name>, which the provider rejects.
    if: "github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'"
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-cloudflare-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          create_credentials_file: true

      - name: Read pinned Terraform version
        id: terraform_version
        run: printf 'version=%s\n' "$(tr -d '[:space:]' < terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform_version.outputs.version }}

      - name: Initialize remote state
        run: >-
          terraform -chdir=terraform init -input=false -reconfigure
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}"

      - name: Create reviewed apply plan
        run: terraform -chdir=terraform plan -input=false -no-color -out=apply.tfplan

      - name: Apply exact plan
        run: terraform -chdir=terraform apply -input=false -auto-approve apply.tfplan
