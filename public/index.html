<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sprue.works</title>
    <meta name="description" content="sprue.works" />
    <meta name="color-scheme" content="light dark" />
    <!-- A meta tag cannot read a CSS variable: these mirror --sw-bg in
         brand/v2/theme.css (Floral White / Coffee Bean). Change them together. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff7ed" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#251818" />

    <!-- Brand tokens (typefaces, palette) and the wordmark composition built
         from them, both hosted for other properties under /brand/v2/ and
         documented in brand/README.md. theme.css @imports the Google Fonts CSS
         itself; the preconnects just warm those hosts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The wordmark's "works" face is only found once theme.css is parsed;
         fetch it alongside so the h1 does not first set in a fallback mono. -->
    <link rel="preload" href="brand/v2/fonts/iosevka-sprue-34.8.1-run10-extended-200.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="brand/v2/theme.css" />
    <link rel="stylesheet" href="brand/v2/wordmark.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <!--
        Wordmark. Until the logo (#1) lands, this is plain text in three parts
        so each can be styled on its own. The sw- classes are the hosted
        composition (brand/v2/wordmark.css); --brand asks for the coloured logo
        treatment rather than currentColor, and .wordmark is this page's own
        display sizing in style.css. There must be no whitespace between the
        spans. To swap in the SVG, replace all three with one line:
          <img class="wordmark__mark" src="brand/v2/logo.svg" alt="sprue.works" />
      -->
      <h1 class="wordmark sw-wordmark sw-wordmark--brand"><span class="sw-wordmark__sprue">sprue</span><span class="sw-wordmark__dot">.</span><span class="sw-wordmark__works">works</span></h1>
    </main>

    <footer>
      <a href="https://polyglot.sprue.works">Polyglot Slides</a>
    </footer>
  </body>
</html>
